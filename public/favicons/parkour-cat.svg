<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#0d1a0d"/>
  <!-- ears -->
  <polygon points="7,13 10,6 13,13" fill="#f59e0b"/>
  <polygon points="19,13 22,6 25,13" fill="#f59e0b"/>
  <!-- inner ears -->
  <polygon points="8.5,12 10,7.5 11.5,12" fill="#fcd34d"/>
  <polygon points="20.5,12 22,7.5 23.5,12" fill="#fcd34d"/>
  <!-- head -->
  <ellipse cx="16" cy="18" rx="9" ry="8" fill="#f59e0b"/>
  <!-- eyes -->
  <ellipse cx="12.5" cy="16.5" rx="2" ry="2.5" fill="#1a1a1a"/>
  <ellipse cx="19.5" cy="16.5" rx="2" ry="2.5" fill="#1a1a1a"/>
  <circle cx="13" cy="16" r="0.8" fill="#60c0ff"/>
  <circle cx="20" cy="16" r="0.8" fill="#60c0ff"/>
  <!-- nose -->
  <ellipse cx="16" cy="20" rx="1.5" ry="1" fill="#f87171"/>
  <!-- mouth -->
  <path d="M14.5 21 Q16 22.5 17.5 21" fill="none" stroke="#1a1a1a" stroke-width="0.8" stroke-linecap="round"/>
  <!-- whiskers -->
  <line x1="7" y1="19" x2="12" y2="20" stroke="#fcd34d" stroke-width="0.7" opacity="0.8"/>
  <line x1="7" y1="21" x2="12" y2="21" stroke="#fcd34d" stroke-width="0.7" opacity="0.8"/>
  <line x1="20" y1="20" x2="25" y2="19" stroke="#fcd34d" stroke-width="0.7" opacity="0.8"/>
  <line x1="20" y1="21" x2="25" y2="21" stroke="#fcd34d" stroke-width="0.7" opacity="0.8"/>
</svg>
